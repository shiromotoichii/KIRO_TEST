{% extends "base.html" %}
{% block title %}ログイン - TODO Manager{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">
          <i class="bi bi-lock-fill text-primary me-2"></i>ログイン
        </h4>
        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" class="form-control" id="password"
                   name="password" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember"
                   name="remember">
            <label class="form-check-label" for="remember">ログイン状態を保持する</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
          </button>
        </form>
        <hr>
        <p class="text-center mb-0 small">
          アカウントをお持ちでない方は
          <a href="{{ url_for('auth.register') }}">新規登録</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
