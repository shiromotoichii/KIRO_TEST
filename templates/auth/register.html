{% extends "base.html" %}
{% block title %}新規登録 - TODO Manager{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">
          <i class="bi bi-person-plus-fill text-primary me-2"></i>新規登録
        </h4>
        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label for="username" class="form-label">ユーザー名</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ username }}" required autofocus maxlength="80">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email }}" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード（6文字以上）</label>
            <input type="password" class="form-control" id="password"
                   name="password" required minlength="6">
          </div>
          <div class="mb-3">
            <label for="password_confirm" class="form-label">パスワード（確認）</label>
            <input type="password" class="form-control" id="password_confirm"
                   name="password_confirm" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check me-1"></i>登録する
          </button>
        </form>
        <hr>
        <p class="text-center mb-0 small">
          すでにアカウントをお持ちの方は
          <a href="{{ url_for('auth.login') }}">ログイン</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
